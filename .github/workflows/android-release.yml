name: Build downloadable Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the Android source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build the installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare the direct-download file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Hiddentify.apk
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep "SHA256:"

      - name: Keep a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hiddentify-Android-APK
          path: Hiddentify.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-direct >/dev/null 2>&1; then
            gh release upload android-direct Hiddentify.apk --clobber
          else
            gh release create android-direct Hiddentify.apk \
              --title "Hiddentify for Android" \
              --notes "Direct Android download for hiddentify.space."
          fi
