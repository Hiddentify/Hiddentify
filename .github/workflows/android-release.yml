name: Build downloadable Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the Android source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses and install build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build the installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash android/smoke-test.sh

      - name: Verify APK identity and prepare downloads
        run: |
          APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK_PATH"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH")"
          echo "$BADGING" | grep -F "package: name='space.hiddentify.app' versionCode='5' versionName='1.1.3'"
          cp "$APK_PATH" Hiddentify-1.1.3.apk
          cp "$APK_PATH" Hiddentify.apk
          sha256sum Hiddentify-1.1.3.apk Hiddentify.apk
          echo "Built from $GITHUB_SHA"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK_PATH" | grep -E 'Signer #1 certificate SHA-256 digest'

      - name: Keep a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hiddentify-Android-APK
          path: |
            Hiddentify-1.1.3.apk
            Hiddentify.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-direct >/dev/null 2>&1; then
            gh release upload android-direct Hiddentify-1.1.3.apk Hiddentify.apk --clobber
            gh release edit android-direct --target "$GITHUB_SHA" --notes "Android 1.1.3 built from $GITHUB_SHA. Emulator startup and homepage load passed. This APK is debug signed; uninstall any previous build if Android rejects the update."
          else
            gh release create android-direct Hiddentify-1.1.3.apk Hiddentify.apk \
              --title "Hiddentify for Android" \
              --target "$GITHUB_SHA" \
              --notes "Android 1.1.3 built from $GITHUB_SHA. Emulator startup and homepage load passed. This APK is debug signed; uninstall any previous build if Android rejects the update."
          fi
