plugins {
    id 'com.android.application'
}

def releaseSigningEnvironment = [
    'ANDROID_KEYSTORE_PATH',
    'ANDROID_KEYSTORE_PASSWORD',
    'ANDROID_KEY_ALIAS',
    'ANDROID_KEY_PASSWORD',
]
def hasReleaseSigning = releaseSigningEnvironment.every { System.getenv(it) }

android {
    namespace "space.hiddentify.app"
    compileSdkVersion 36

    defaultConfig {
        applicationId "space.hiddentify.app"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 4
        versionName "1.1.2"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    // Kept temporarily so the legacy, now-unused TWA helper classes still compile.
    // The launcher itself is the native fullscreen WebView activity.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}
