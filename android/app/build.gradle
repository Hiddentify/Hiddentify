plugins {
    id 'com.android.application'
}

def releaseSigningEnvironment = [
    'ANDROID_KEYSTORE_PATH',
    'ANDROID_KEYSTORE_PASSWORD',
    'ANDROID_KEY_ALIAS',
]
def hasReleaseSigning = releaseSigningEnvironment.every { System.getenv(it) }

android {
    namespace "space.hiddentify.app"
    compileSdkVersion 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "space.hiddentify.app"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 5
        versionName "1.1.3"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                // Our PKCS12 key uses the store password for its private key.
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
    }
}
